<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Inventory" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1220" />
  <title>Inventory Scanner</title>
  <style>
    :root { --bg:#0b1220; --card:#152033; --line:#24344d; --text:#f3f6fb; --muted:#9aa8bc; --in:#1f9d55; --out:#d35400; --blue:#2f80ed; --danger:#e74c3c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { max-width:760px; margin:0 auto; padding:16px 14px 96px; }
    h1 { font-size:22px; }
    p.sub { color:var(--muted); margin:4px 0 14px; font-size:14px; }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
    .pill { background:#1b2a42; border:1px solid var(--line); border-radius:999px; padding:6px 10px; font-size:12px; color:var(--muted); }
    .okdot { width:8px; height:8px; border-radius:50%; background:#27ae60; display:inline-block; margin-right:6px; }
    .baddot { background:#e67e22; }
    .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 14px; }
    .mode { border:0; border-radius:16px; padding:18px 10px; font-size:22px; font-weight:800; color:#fff; cursor:pointer; }
    .mode.in { background:var(--in); opacity:.45; }
    .mode.out { background:var(--out); opacity:.45; }
    .mode.on { opacity:1; outline:3px solid #fff; }
    #reader { width:100%; min-height:260px; background:#000; border-radius:16px; overflow:hidden; }
    .hint { color:var(--muted); font-size:13px; margin:8px 0 14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; }
    input,select,textarea { width:100%; background:#0d1726; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px; }
    label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; font-weight:700; }
    button { border:0; border-radius:12px; padding:12px 14px; font-weight:800; cursor:pointer; background:#2a3c59; color:#fff; font-size:15px; }
    .primary { background:var(--blue); width:100%; padding:16px; font-size:18px; }
    .inbtn { background:var(--in); width:100%; padding:16px; font-size:18px; }
    .outbtn { background:var(--out); width:100%; padding:16px; font-size:18px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    .row > * { flex:1; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; }
    .tabs { position:fixed; left:0; right:0; bottom:0; background:#0e1730; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto; }
    .tabs button { background:transparent; color:var(--muted); font-size:12px; padding:8px 4px; }
    .tabs button.on { color:#fff; }
    .page { display:none; }
    .page.on { display:block; }
    .qty { display:flex; align-items:center; gap:8px; }
    .qty input { text-align:center; font-size:22px; font-weight:800; }
    .qty button { width:48px; height:48px; font-size:24px; }
    .toast { position:fixed; top:12px; left:12px; right:12px; max-width:736px; margin:0 auto; background:#123; border:1px solid #3a6; padding:12px 14px; border-radius:12px; display:none; z-index:20; font-weight:700; }
    .toast.on { display:block; }
    .toast.err { border-color:var(--danger); }
    .big { font-size:28px; font-weight:800; }
    .muted { color:var(--muted); }
    .item-actions button { margin:4px 4px 0 0; padding:8px 10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="bar">
    <div>
      <h1>Inventory Scanner</h1>
      <p class="sub">Same list on your phone and computer. Just open this page.</p>
    </div>
    <div class="pill" id="syncpill"><span class="okdot baddot" id="dot"></span><span id="synctxt">Connecting…</span></div>
  </div>

  <section class="page on" id="page-scan">
    <div class="modes">
      <button class="mode in on" id="btn-in" onclick="setMode('in')">SCAN IN</button>
      <button class="mode out" id="btn-out" onclick="setMode('out')">SCAN OUT</button>
    </div>
    <div id="reader"></div>
    <p class="hint" id="cam-hint">Allow the camera when asked. Point it at the QR sticker.</p>
    <div class="card">
      <label>Or type the code</label>
      <div class="row">
        <input id="manual" placeholder="Item ID or SKU" />
        <button onclick="lookup(document.getElementById('manual').value)">Find</button>
      </div>
    </div>
    <div class="card" id="match">Scan a label to check something in or out.</div>
  </section>

  <section class="page" id="page-items">
    <div class="row" style="margin-bottom:10px">
      <input id="search" placeholder="Search items" oninput="drawItems()" />
      <button class="primary" style="flex:0 0 auto;width:auto;padding:12px 14px" onclick="openEdit()">+ Add item</button>
    </div>
    <div id="items"></div>
  </section>

  <section class="page" id="page-report">
    <div class="card">
      <div class="row">
        <div><div class="muted">Items</div><div class="big" id="r-skus">0</div></div>
        <div><div class="muted">Units here</div><div class="big" id="r-qty">0</div></div>
        <div><div class="muted">Low / out</div><div class="big" id="r-low">0</div></div>
      </div>
    </div>
    <div class="row" style="margin:10px 0">
      <button onclick="exportCsv('items')">Download item list</button>
      <button onclick="exportCsv('txns')">Download scan history</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">Low stock</h3>
      <div id="r-lowtbl"></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">Recent scans</h3>
      <div id="r-hist"></div>
    </div>
  </section>

  <section class="page" id="page-more">
    <div class="card">
      <label>Your name (saved on every scan)</label>
      <input id="operator" placeholder="e.g. Gabe" />
      <label>Warehouse name</label>
      <input id="sitename" placeholder="e.g. Shop" />
      <label>Warn me when quantity is at or below</label>
      <input id="lowstock" type="number" min="0" value="5" />
      <div style="height:10px"></div>
      <button class="primary" onclick="saveSettings()">Save</button>
    </div>
    <div class="card">
      <p style="margin-bottom:10px">On iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
      <button onclick="printAll()">Print all QR labels</button>
      <button onclick="seedDemo()">Add sample items</button>
      <button onclick="backup()">Download backup</button>
      <button onclick="document.getElementById('restore').click()">Restore backup</button>
      <input id="restore" type="file" accept="application/json" hidden onchange="restoreFile(this.files[0])" />
    </div>
  </section>

  <nav class="tabs">
    <button class="on" data-p="scan" onclick="show('scan', this)">Scan</button>
    <button data-p="items" onclick="show('items', this)">Items</button>
    <button data-p="report" onclick="show('report', this)">Report</button>
    <button data-p="more" onclick="show('more', this)">More</button>
  </nav>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
